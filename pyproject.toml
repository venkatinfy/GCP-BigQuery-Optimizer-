[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bq-optimizer"
version = "0.1.0"
description = "Systematic BigQuery SQL query analyzer and optimizer"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["sqlglot>=20.0.0"]

[project.scripts]
bq-optimizer = "bq_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bq_optimizer*"]
